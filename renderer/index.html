<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; img-src 'self' data: https: http:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Pack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="mast">
        <div class="mast-brand">
          <h1 class="brand">Auto Pack</h1>
          <p class="tagline">按分支打包 · 蒲公英分发</p>
        </div>
        <div class="mast-actions">
          <p class="artifact-stamp" id="target-hint"></p>
          <button type="button" id="refresh" class="ghost">重新检查</button>
        </div>
      </header>

      <div class="stage">
        <aside class="rail" id="readiness-panel" aria-label="工作流">
          <div class="rail-head">
            <h2 class="rail-title">工作流</h2>
            <span class="rail-mark" aria-hidden="true"></span>
          </div>

          <ul class="checks" id="checks" aria-label="就绪检查"></ul>

          <label class="field field-branch">
            <span class="field-label">分支</span>
            <select id="branch-select" disabled>
              <option value="">—</option>
            </select>
          </label>
          <p class="hint hint-tight" id="branch-hint"></p>

          <div class="rail-section" aria-labelledby="strip-targets-title">
            <h3 class="strip-title" id="strip-targets-title">目标</h3>
            <div class="target-list" id="target-list" role="group" aria-label="平台与模式">
              <label class="target-row-pick">
                <input type="checkbox" data-platform="android" checked />
                <span class="target-platform">Android</span>
                <select data-mode-for="android" aria-label="Android 模式">
                  <option value="debug">debug</option>
                  <option value="release" selected>release</option>
                </select>
              </label>
              <label class="target-row-pick">
                <input type="checkbox" data-platform="ios" checked />
                <span class="target-platform">iOS</span>
                <select data-mode-for="ios" aria-label="iOS 模式">
                  <option value="debug">debug</option>
                  <option value="release" selected>release</option>
                </select>
              </label>
              <label class="target-row-pick">
                <input type="checkbox" data-platform="harmony" checked />
                <span class="target-platform">Harmony</span>
                <select data-mode-for="harmony" aria-label="Harmony 模式">
                  <option value="debug">debug</option>
                  <option value="release">release (.app)</option>
                  <option value="profile" selected>profile (hap)</option>
                </select>
              </label>
            </div>
          </div>

          <div class="rail-section pack-options" aria-labelledby="strip-options-title">
            <h3 class="strip-title" id="strip-options-title">选项</h3>
            <div class="option-chips">
              <label class="chip" title="隐藏测试球并锁正式环境（TF_NET_PRODUCT）">
                <input type="checkbox" id="pack-product" />
                <span>上架包</span>
              </label>
              <label
                class="chip"
                id="pgyer-password-install-row"
                title="取消则为公开安装；仅本次，不写回 .env"
              >
                <input type="checkbox" id="pgyer-password-install" checked />
                <span>密码安装</span>
              </label>
            </div>
            <label class="field field-password" id="pgyer-password-field">
              <input
                type="password"
                id="pgyer-password"
                autocomplete="off"
                placeholder="安装密码 · 空=用 .env"
                aria-label="安装密码"
              />
              <span class="sr-only" id="pgyer-password-hint">留空则用 .env 默认</span>
            </label>
            <label class="field field-note">
              <textarea
                id="update-description"
                rows="4"
                maxlength="500"
                placeholder="安装说明（可选）"
                aria-label="安装说明"
              ></textarea>
            </label>
          </div>

          <div class="rail-section strip-actions" aria-labelledby="strip-actions-title">
            <h3 class="strip-title" id="strip-actions-title">操作</h3>
            <div class="lanes" role="group">
              <button type="button" data-lane="build" id="btn-build">构建</button>
              <button type="button" data-lane="upload_pgyer" id="btn-upload">上传</button>
              <button
                type="button"
                class="primary"
                data-lane="distribute"
                id="btn-distribute"
              >
                构建并上传
              </button>
            </div>
            <p class="hint action-hint" id="action-hint"></p>
          </div>
        </aside>

        <main class="work">
          <section class="host-bar" aria-label="工程与凭据">
            <div class="host-row">
              <div class="host-path">
                <span class="host-k">App</span>
                <span class="host-v" id="app-root" title="">—</span>
              </div>
              <button type="button" id="pick-app-root" class="btn-compact host-action">
                App Root…
              </button>
            </div>
            <div class="host-row">
              <div class="host-path">
                <span class="host-k">Pack</span>
                <span class="host-v" id="pack-root" title="">—</span>
              </div>
              <div class="pgyer-key-row host-action">
                <input
                  id="pgyer-api-key"
                  type="password"
                  autocomplete="off"
                  placeholder="蒲公英 API Key"
                  aria-label="蒲公英 API Key"
                />
                <button type="button" id="save-pgyer-key" class="btn-compact">
                  保存
                </button>
              </div>
            </div>
            <div class="host-row">
              <div class="host-path">
                <span class="host-k">FVM</span>
                <span class="host-v" id="flutter-bin" title="">—</span>
              </div>
              <p class="hint hint-tight host-action" id="key-hint"></p>
            </div>
          </section>

          <section class="runs-panel" aria-label="运行日志">
            <div class="runs-head">
              <div class="run-tabs" id="run-tabs"></div>
              <div class="runs-tools">
                <div class="log-filter" role="group" aria-label="日志详细程度">
                  <button
                    type="button"
                    class="log-filter-btn active"
                    data-log-mode="focus"
                    id="log-mode-focus"
                  >
                    精简
                  </button>
                  <button
                    type="button"
                    class="log-filter-btn"
                    data-log-mode="all"
                    id="log-mode-all"
                  >
                    全部
                  </button>
                </div>
                <span class="log-meta" id="log-meta"></span>
                <button type="button" id="cancel-run" class="danger" disabled>
                  取消
                </button>
              </div>
            </div>
            <div class="log-bay">
              <div class="log-bay-edge" aria-hidden="true"></div>
              <div class="log-bay-body">
                <pre class="log" id="log" aria-live="polite"></pre>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="log-filter.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
